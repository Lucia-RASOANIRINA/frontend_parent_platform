<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parentia — Hors ligne</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #FBF7F1; color: #3E2C1F; padding: 24px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .carte {
      max-width: 420px; text-align: center; background: #fff;
      border: 1px solid #F0E9E0; border-radius: 28px; padding: 40px 32px;
      box-shadow: 0 18px 40px rgba(62, 44, 31, .1);
    }
    .rond {
      width: 74px; height: 74px; margin: 0 auto 20px; border-radius: 50%;
      background: linear-gradient(135deg, #C19A6B, #6F4E37);
      display: grid; place-items: center; color: #fff;
    }
    h1 { font-size: 1.35rem; margin: 0 0 10px; }
    p { color: #6b5d4f; line-height: 1.65; margin: 0 0 22px; font-size: .92rem; }
    button {
      border: none; cursor: pointer; font-weight: 700; font-size: .9rem;
      background: linear-gradient(135deg, #C19A6B, #6F4E37); color: #fff;
      padding: 12px 26px; border-radius: 30px;
    }
    button:focus-visible { outline: 3px solid rgba(193, 154, 107, .5); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="carte">
    <div class="rond" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M18.364 5.636a9 9 0 0 1 0 12.728M5.636 18.364a9 9 0 0 1 0-12.728M12 12h.01M3 3l18 18" />
      </svg>
    </div>
    <h1>Vous êtes hors connexion</h1>
    <p>
      Parentia n'arrive pas à joindre le serveur. Les pages déjà consultées restent
      accessibles ; le reste reviendra dès le retour du réseau.
    </p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
